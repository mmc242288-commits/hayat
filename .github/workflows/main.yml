name: Hayat Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unpack app.zip
        run: |
          if [ -f app.zip ] && [ ! -f app/build.gradle ]; then
            unzip -o app.zip
          fi

      - name: Check project files
        run: |
          echo "Files in repo:"
          find . -type f -not -path './.git/*' | sort
          for f in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/touchpilot/TouchService.kt; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; MISSING=1; fi
          done
          if [ -n "$MISSING" ]; then exit 1; fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hayat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
